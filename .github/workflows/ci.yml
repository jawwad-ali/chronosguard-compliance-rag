name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: apps/api

env:
  UV_FROZEN: "1" # CI installs exactly what uv.lock pins

jobs:
  quality:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Sync dependencies
        run: uv sync
      - name: Pytest (unit lanes)
        run: uv run pytest -m "not integration and not rls and not contract and not eval" --cov --cov-report=term

  integration:
    name: Integration + RLS (blocking)
    runs-on: ubuntu-latest # docker available natively; testcontainers just works
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Sync dependencies
        run: uv sync
      - name: Pytest (integration + RLS + contract)
        # The RLS lane is BLOCKING: a cross-tenant leak is a security incident,
        # not a flaky test. The session fixture also proves migration
        # reversibility (upgrade -> downgrade -> upgrade) every run.
        run: uv run pytest -m "integration or rls or contract" -q
